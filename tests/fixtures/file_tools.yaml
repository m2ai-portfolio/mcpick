server_name: "File Operations"
description: "MCP server for file operations"
author: "Test Author"
author_email: "test@example.com"
version: "0.2.0"

tools:
  - name: "read_file"
    description: "Read contents of a file"
    parameters:
      - name: "path"
        type: "string"
        description: "File path to read"
        required: true
      - name: "encoding"
        type: "string"
        description: "File encoding"
        required: false
        default: "utf-8"
    return_type: "object"
    return_description: "File contents"

  - name: "write_file"
    description: "Write contents to a file"
    parameters:
      - name: "path"
        type: "string"
        description: "File path to write"
        required: true
      - name: "content"
        type: "string"
        description: "Content to write"
        required: true
      - name: "append"
        type: "boolean"
        description: "Whether to append instead of overwrite"
        required: false
        default: false
    return_type: "object"

dependencies:
  pathlib2: ">=2.3.0"
